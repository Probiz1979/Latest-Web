<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Boost Practice Revenue | Probiz</title>
<link rel="icon" type="image/png" href="../favicon-probiz-removebg-preview.png">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<link href="../styles.css" rel="stylesheet"/>
<style>
    .campaign-header { padding: 40px 0; background: var(--clr-navy-dark); border-bottom: 3px solid var(--clr-gold); }
</style>
</head>
<body class="bg-surface">
<header class="campaign-header">
    <div class="container" style="display: flex; justify-content: space-between; align-items: center;">
        <img src="../Probiz logo.png" style="height: 50px;">
        <div style="color: #fff; font-weight: 700; font-size: 1.2rem;"><i class="fa-solid fa-phone" style="color: var(--clr-gold);"></i> 044181222</div>
    </div>
</header>
<section class="subpage-hero" style="min-height: 100vh; display: flex; align-items: center;">
    <div class="subpage-hero-bg" style="background-image: url('../assets/medical_billing_dashboard_1777730057032.png'); opacity: 0.2;"></div>
    <div class="container relative z-10">
        <div style="display: grid; grid-template-columns: 1.2fr 1fr; gap: 80px; align-items: center;">
            <div class="reveal">
                <h1 class="section-title serif text-white" style="font-size: 5rem;">Stop Losing <span class="text-shimmer-gold">20%+ Revenue</span> to Denials</h1>
                <p class="text-white-muted" style="font-size: 1.5rem; line-height: 1.6;">Our certified billing experts recover trapped capital and accelerate cash flow with Up to 99% accuracy.</p>
                <ul style="margin-top: 40px; display: grid; gap: 20px;">
                    <li style="color: #fff; display: flex; align-items: center; gap: 15px; font-size: 1.2rem;"><i class="fa-solid fa-circle-check" style="color: var(--clr-gold);"></i> HIPAA Compliant Security</li>
                    <li style="color: #fff; display: flex; align-items: center; gap: 15px; font-size: 1.2rem;"><i class="fa-solid fa-circle-check" style="color: var(--clr-gold);"></i> AAPC/AHIMA Certified Coders</li>
                    <li style="color: #fff; display: flex; align-items: center; gap: 15px; font-size: 1.2rem;"><i class="fa-solid fa-circle-check" style="color: var(--clr-gold);"></i> 72-Hour Claim Submission</li>
                </ul>
            </div>
            <div class="bento-item reveal" style="padding: 50px;">
                <h3 style="text-align: center; margin-bottom: 30px;">Request Free Billing Audit</h3>
                <form action="#" style="display: grid; gap: 20px;">
                    <input type="text" placeholder="Full Name" style="padding: 15px; border-radius: 8px; border: 1px solid #ddd;">
                    <input type="email" placeholder="Email Address" style="padding: 15px; border-radius: 8px; border: 1px solid #ddd;">
                    <input type="tel" placeholder="Phone Number" style="padding: 15px; border-radius: 8px; border: 1px solid #ddd;">
                    <select style="padding: 15px; border-radius: 8px; border: 1px solid #ddd;">
                        <option>Practice Size...</option>
                        <option>Solo Practice</option>
                        <option>Group Practice</option>
                        <option>Hospital / Facility</option>
                    </select>
                    <button type="button" class="btn btn-primary" style="padding: 20px;">Get My Free ROI Audit</button>
                </form>
            </div>
        </div>
    </div>
</section>
</body>
</html>
